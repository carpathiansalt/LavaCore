; TWANG / LavaCore firmware - PlatformIO
; Multi-board build matrix.
;
; Environments:
;   esp32dev       - Original TWANG32 hardware (GPIO 16)
;   esp32-gpio2    - Most WLED boards (GPIO 2)
;   esp32-gpio5    - Some custom builds (GPIO 5)
;   esp32dev-debug - Debug build with serial traces
;
; Build all:    pio run
; Build one:    pio run -e esp32dev
; Upload one:   pio run -e esp32dev -t upload
; Monitor:      pio device monitor -b 115200

[platformio]
src_dir = src
default_envs = esp32dev

; ──── Shared base configuration ────────────────────────────────────────────
[common]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    ; N-player support: allow up to 4 concurrent BLE centrals (phones) plus
    ; headroom for service discovery overlap. Bumps NimBLE RAM budget by a
    ; few KB but stays within ESP32 WROOM capacity.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5
build_unflags =
    -std=gnu++11
lib_deps =
    fastled/FastLED @ 3.6.0
    h2zero/NimBLE-Arduino @ 1.4.2
    robtillaart/RunningMedian @ 0.3.9
lib_ldf_mode = deep+

; ──── Original TWANG32 hardware — LED on GPIO 16 ──────────────────────────
[env:esp32dev]
extends = common
build_flags =
    ${common.build_flags}
    -DTWANG_DATA_PIN_OVERRIDE=16

; ──── WLED boards — LED on GPIO 2 ─────────────────────────────────────────
[env:esp32-gpio2]
extends = common
build_flags =
    ${common.build_flags}
    -DTWANG_DATA_PIN_OVERRIDE=2

; ──── Custom builds — LED on GPIO 5 ───────────────────────────────────────
[env:esp32-gpio5]
extends = common
build_flags =
    ${common.build_flags}
    -DTWANG_DATA_PIN_OVERRIDE=5

; ──── Debug build (GPIO 16 + serial traces) ───────────────────────────────
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env:esp32dev.build_flags}
    -DJOYSTICK_DEBUG
    -DCORE_DEBUG_LEVEL=4
